<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜株式会社かみねんど</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#05070f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--ink:#e8ecf5;--bg:#05070f;--cyan:#9fe8ff;--green:#8ef0b4;--gold:#ffd76a;--line:#06c755}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DotGothic16','MS Gothic','ＭＳ ゴシック',monospace;line-height:1.9;display:flex;align-items:center;justify-content:center;padding:24px}
#crt{position:fixed;inset:0;z-index:9;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);opacity:.4}
.win{position:relative;max-width:520px;width:100%;background:rgba(4,8,18,.92);border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 3px #000,inset 0 0 0 2px #000;padding:30px 22px 26px}
.cap{position:absolute;top:-12px;left:12px;background:#000;border:2px solid #fff;border-radius:5px;padding:1px 10px;font-size:12px;letter-spacing:.15em;color:var(--gold)}
h1{font-size:clamp(20px,5.5vw,26px);letter-spacing:.08em;line-height:1.5}
p{font-size:13.5px;color:#c5cede;margin-top:14px}
.row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:#000;border:3px solid #fff;border-radius:8px;color:#fff;text-decoration:none;font-family:inherit;font-size:14px;padding:11px 17px;letter-spacing:.05em}
.btn.primary{border-color:var(--line);background:var(--line)}
.sub{font-size:11px;color:#8b93a8;margin-top:18px;letter-spacing:.06em}
.sub a{color:var(--cyan)}
</style>
</head>
<body>
<div class="win">
  <span class="cap">MISS</span>
  <h1>＊そのページは<br>みつからなかった…</h1>
  <p>URLが変わったか、まだ存在しないページのようです。トップから探しなおしてください。</p>
  <div class="row">
    <a class="btn primary" href="/">▶ トップへもどる</a>
    <a class="btn" href="/#contact">✉ お問い合わせ</a>
  </div>
  <p class="sub">株式会社かみねんど ／ <a href="/">kaminendo.art</a></p>
</div>
<div id="crt"></div>
</body>
</html>
